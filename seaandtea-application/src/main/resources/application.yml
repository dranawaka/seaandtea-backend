spring:
  application:
    name: seaandtea-backend
  config:
    import: optional:file:.env.local[.properties],optional:file:../.env.local[.properties]
  main:
    lazy-initialization: ${SPRING_LAZY_INIT:false}
  
  # Common configuration shared across all environments
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:aws-0-us-east-1.pooler.supabase.com}:${DB_PORT:6543}/${DB_NAME:postgres}?sslmode=require&prepareThreshold=0
    username: ${DB_USERNAME:postgres.agehzrdlnfvzswhukuob}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:2}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
      data-source-properties:
        sslmode: require
        prepareThreshold: 0
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${FORMAT_SQL:true}

  
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: ${LIQUIBASE_CONTEXTS:default}

# Common JWT Configuration
jwt:
  secret: ${JWT_SECRET:ZGVmYXVsdC1zZWNyZXQta2V5LWZvci1kZXZlbG9wbWVudC1vbmx5LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 86400000 # 24 hours

# Common Stripe Configuration
stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_dummy}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_dummy}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_dummy}

# Common Cloudinary Configuration
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:do0x8z2ju}
  api-key: ${CLOUDINARY_API_KEY:395789284248876}
  api-secret: ${CLOUDINARY_API_SECRET:RqIxjLLJwXH2BqIErRKwbfA1fB8}
  folder: ${CLOUDINARY_FOLDER:sea-and-tea}



app:
  # Swagger and /v3/api-docs stay off for anonymous clients.
  # The local profile sets this to true for development only.
  api-docs:
    permit-all: false
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    facebook:
      client-id: ${FACEBOOK_CLIENT_ID:}
      client-secret: ${FACEBOOK_CLIENT_SECRET:}

# Common Server Configuration
server:
  port: ${PORT:8080}
  # Honor X-Forwarded-Proto so Google and Facebook redirect URIs stay https behind Railway.
  forward-headers-strategy: framework


# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    mail:
      enabled: false

# API docs are disabled on deployed environments. Enable them with the local profile.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

things-to-do:
  seed:
    enabled: true
  deploy-hook-url: ${THINGS_TO_DO_DEPLOY_HOOK_URL:}

# Common Logging Configuration
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  
  level:
    root: INFO
    com.seaandtea: ${LOG_LEVEL:INFO}
    org.springframework.security: INFO
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}
    org.hibernate.type.descriptor.sql.BasicBinder: ${SQL_LOG_LEVEL:INFO}
    org.springframework.web: INFO
    org.springframework.web.servlet: INFO
    com.seaandtea.interceptor: INFO
    com.seaandtea.filter: INFO
    com.seaandtea.util: INFO
